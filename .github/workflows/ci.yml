name: CI

on:
  push:
    branches: [ "main", "ci" ]
  pull_request:
    branches: [ "main", "ci" ]

jobs:
  guix-build:
    runs-on: ubuntu-latest
    steps:
    - name: Git checkout
      uses: actions/checkout@v4
    # Ubuntu 24.04 (ubuntu-latest) restricts unprivileged user namespaces via
    # AppArmor, which prevents guix-daemon from starting. Relax it before install.
    - name: Permit unprivileged user namespaces
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
    - name: Install Guix
      uses: PromyLOPh/guix-install-action@v1.6
    - name: Install GNU Make
      run: guix install make
    - name: Test
      run: make test
    - name: Build
      run: make build
